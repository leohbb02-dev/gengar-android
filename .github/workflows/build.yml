
name: Compilar Gengar IA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir -p "$RUNNER_TEMP/gengar"
          unzip -q gengar-android.zip -d "$RUNNER_TEMP/gengar"

          SETTINGS_FILE=$(find "$RUNNER_TEMP/gengar" \
            -type f -name settings.gradle -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle não encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gengar-IA-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
